<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"><rect x="0" y="0" width="760" height="330" fill="#ffffff"/><rect x="16" y="16" width="520" height="298" rx="8" ry="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="32" y="42" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="start">Global store</text><text x="32" y="60" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="start">global var · global computed — every running program reads and writes the same value</text><rect x="36" y="76" width="230" height="222" rx="8" ry="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="50" y="100" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="start">Main program run</text><text x="50" y="124" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">var count</text><text x="50" y="142" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">persistent var runs</text><text x="50" y="160" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">computed area</text><rect x="50" y="176" width="202" height="108" rx="8" ry="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="62" y="196" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="start">called routine</text><text x="62" y="216" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">param in slot</text><text x="62" y="234" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">param out picked</text><text x="62" y="256" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="start">shares the run's variable scope —</text><text x="62" y="270" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="start">name parameters distinctly</text><rect x="286" y="76" width="230" height="222" rx="8" ry="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><text x="300" y="100" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="start">Background program run</text><text x="300" y="124" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">var pulses</text><text x="300" y="146" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="start">its own variables, separate</text><text x="300" y="162" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="start">from the main program's</text><rect x="300" y="180" width="202" height="60" rx="8" ry="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/><text x="312" y="200" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="start">loop / for-each variables</text><text x="312" y="216" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="start">are ordinary program variables</text><rect x="556" y="16" width="188" height="140" rx="8" ry="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="570" y="42" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="start">Read-only</text><text x="570" y="66" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">$robot.x  $time.hour</text><text x="570" y="86" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">$program.runCount</text><text x="570" y="106" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">$stb.in1  $io.Nano.Pin</text><text x="570" y="130" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="start">properties and IO —</text><text x="570" y="144" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="start">read anywhere, never assigned</text><rect x="556" y="174" width="188" height="140" rx="8" ry="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="570" y="200" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="start">On disk</text><text x="570" y="222" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="start">persistent: saved when the</text><text x="570" y="238" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="start">run finishes, restored at</text><text x="570" y="254" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="start">the next start</text></svg>
