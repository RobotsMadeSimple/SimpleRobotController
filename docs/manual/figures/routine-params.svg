<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260"><rect x="0" y="0" width="760" height="260" fill="#ffffff"/><rect x="16" y="16" width="300" height="228" rx="8" ry="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="30" y="42" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="start">Caller</text><text x="30" y="76" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">var ok: bool</text><text x="30" y="96" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">var n = 3</text><text x="30" y="140" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#7c3aed" text-anchor="start">call PickPart(slot=$n + 1),</text><text x="46" y="158" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#7c3aed" text-anchor="start">out picked=$ok</text><text x="30" y="210" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">if not $ok …</text><rect x="444" y="16" width="300" height="228" rx="8" ry="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="458" y="42" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="start">Routine  PickPart</text><text x="458" y="76" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">param in  slot = 0</text><text x="458" y="96" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">param out picked: bool = off</text><text x="458" y="140" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">JumpL stack Bins[$slot], z=40</text><text x="458" y="160" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">GripperAction close</text><text x="458" y="180" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">$picked = on</text><text x="458" y="210" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">end of routine / return</text><line x1="316" y1="100" x2="436.9" y2="81.1" stroke="#16a34a" stroke-width="2"/><polygon points="444,80 434.3,76.5 435.9,86.3" fill="#16a34a" stroke="none" stroke-width="1"/><text x="326" y="70" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="start">1  slot ← 4</text><text x="326" y="120" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#16a34a" text-anchor="start">evaluated in</text><text x="326" y="134" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#16a34a" text-anchor="start">the caller</text><line x1="444" y1="205" x2="323.1" y2="181.4" stroke="#ea580c" stroke-width="2"/><polygon points="316,180 323.9,186.6 325.8,176.9" fill="#ea580c" stroke="none" stroke-width="1"/><text x="330" y="224" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#ea580c" text-anchor="start">2  ok ← picked</text></svg>
