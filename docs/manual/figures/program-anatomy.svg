<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300"><rect x="0" y="0" width="760" height="300" fill="#ffffff"/><rect x="20" y="20" width="330" height="260" rx="8" ry="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="36" y="46" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="start">Main program</text><text x="36" y="66" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="start">runs from the program list or a display page</text><rect x="36" y="80" width="298" height="56" rx="8" ry="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="48" y="100" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">var count = 0</text><text x="48" y="118" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">var parts: list point</text><text x="318" y="98" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="end">declarations</text><rect x="36" y="146" width="298" height="120" rx="8" ry="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="48" y="166" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">SetTool Gripper</text><text x="48" y="184" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">repeat 12 as $i</text><text x="64" y="202" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#7c3aed" text-anchor="start">call PickPart(slot=$i)</text><text x="64" y="220" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">JumpL grid Tray[$i], z=40</text><text x="48" y="238" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">end</text><text x="48" y="256" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#0d9488" text-anchor="start">StartBackground Conveyor_Watch</text><text x="318" y="164" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="end">steps</text><rect x="420" y="20" width="320" height="120" rx="8" ry="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="436" y="46" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="start">Routine</text><text x="436" y="66" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="start">hidden from the list; runs only when called</text><text x="436" y="90" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">param in slot = 0</text><text x="436" y="108" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">param out picked: bool</text><text x="436" y="126" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">… steps … return</text><rect x="420" y="160" width="320" height="120" rx="8" ry="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><text x="436" y="186" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="start">Background program</text><text x="436" y="206" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="start">runs in parallel; no motion, tool or homing</text><text x="436" y="230" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">repeat forever</text><text x="452" y="248" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">Wait until $stb.in1 == 0</text><text x="436" y="266" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">end</text><polyline points="250,202 380,202 380,80 412.8,80" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-linejoin="round"/><polygon points="420,80 411,75.1 411,85" fill="#7c3aed" stroke="none" stroke-width="1"/><text x="388" y="140" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#7c3aed" text-anchor="start">call</text><polyline points="300,252 390,252 390,220 412.8,220" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-linejoin="round"/><polygon points="420,220 411,215.1 411,225" fill="#0d9488" stroke="none" stroke-width="1"/><text x="342" y="246" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#0d9488" text-anchor="start">start</text></svg>
