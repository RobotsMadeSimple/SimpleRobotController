<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280"><rect x="0" y="0" width="760" height="280" fill="#ffffff"/><text x="20" y="30" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="start">A — condition met</text><text x="20" y="63" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="start">$stb.in1</text><polyline points="160,74 380,74 380,44 720,44" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linejoin="round"/><rect x="160" y="92" width="220" height="28" rx="4" ry="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="270" y="111" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="middle">Wait until $stb.in1</text><rect x="380" y="92" width="150" height="28" rx="4" ry="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/><text x="455" y="111" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="middle">next step</text><text x="540" y="111" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#16a34a" text-anchor="start">timedOut = 0</text><text x="20" y="160" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="start">B — timeout</text><text x="20" y="193" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="start">$stb.in1</text><polyline points="160,204 720,204" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linejoin="round"/><rect x="160" y="222" width="400" height="28" rx="4" ry="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="360" y="241" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="middle">Wait until $stb.in1 … 5 s</text><line x1="560" y1="214" x2="560" y2="262" stroke="#dc2