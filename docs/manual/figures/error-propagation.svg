<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270"><rect x="0" y="0" width="760" height="270" fill="#ffffff"/><rect x="16" y="16" width="728" height="238" rx="8" ry="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="30" y="40" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="start">Main program</text><rect x="40" y="54" width="560" height="184" rx="8" ry="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="52" y="74" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">try  only=(visionFailed)</text><rect x="64" y="86" width="520" height="140" rx="8" ry="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="76" y="106" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">repeat 12</text><rect x="88" y="118" width="480" height="96" rx="8" ry="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="100" y="138" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">call PickPart  (routine)</text><rect x="112" y="154" width="200" height="44" rx="8" ry="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="212" y="171.4" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">RunVision</text><text x="212" y="189.7" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle">fails: visionFailed</text><polyline points="312,176 620,176 620,74 607.2,74" fill="none" stroke="#dc2626" stroke-width="2" stroke-linejoin="round"/><polygon points="600,74 609,79 609,69.1" fill="#dc2626" stroke="none" stroke-width="1"/><text x="626" y="130" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#dc2626" text-anchor="start">caught by</text><text x="626" y="144" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#dc2626" text-anchor="start">the Try</text><text x="340" y="200" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="start">routine abandoned (no outputs copied), loop left</text><text x="622" y="200" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="start">Fatal codes</text><text x="622" y="214" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">(motionFault,</text><text x="622" y="228" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">userStop …) are</text><text x="622" y="242" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">never caught</text></svg>
