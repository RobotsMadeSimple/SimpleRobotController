[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simplerobot-plugin"
version = "0.1.0"
description = "Python SDK for SimpleRobotController plugins"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["websockets>=11"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["simplerobot_plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
